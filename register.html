<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/all.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Register</title>
    </head>
    <body>
        <header class="bg-blue-950 shadow-md shadow-blue-500">
            <div class="logo text-white">
                <h1><a href="index.html">WelcomeStore</a></h1>
            </div>
            <nav>
                <ul>
                    <li>home</li>
                    <li>men</li>
                    <li>women</li>
                </ul>
            </nav>
            <div class="users">
                <ul id="links">
                    <li><a href="login.html">login</a></li>
                    <li><a href="register.html">register</a></li>
                </ul>
            </div>
        </header>
        <main class="bg-gray-200">
            <section class="sec-reg text-blue-950">
                <h1 style="text-align: center;">register page</h1>
                <form class="border border-4 border-cyan-600 an-border text-blue-950 gap-6">
                    <div class="col-3">
                        <input class="effect-3" type="text" placeholder="Enter your name" id="username" class="p-1">
                        <span class="focus-border"></span>
                    </div>
                    <div class="col-3">
                        <input class="effect-3" type="email" placeholder="Enter your email" id="email" class="p-1">
                        <span class="focus-border"></span>
                    </div>
                    <div class="col-3">
                        <input class="effect-3" type="password" placeholder="Enter your password" id="password" class="p-1">
                        <span class="focus-border"></span>
                    </div>
                    <input type="submit" value="sign in" id="sign_in" class="hover:scale-[0.95]">
                </form>
                <p class="p-4" >Have an acouunt? <a href="login.html"  style="text-decoration: underline;">login</a></p>
            </section>
        </main>
        <script src="js/register.js"></script>
    </body>
</html>
