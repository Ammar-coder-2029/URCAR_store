<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/all.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Home</title>
    </head>
    <body>
        <header class="bg-blue-950 shadow-md shadow-blue-500">
            <div class="logo text-white">
                <h1><a href="index.html">UCAR</a></h1>
            </div>
            <nav>
                <ul>
                    <li>home</li>
                    <li id="car-s">sportes car</li>
                    <li id="car-n">normal car</li>
                </ul>
            </nav>
            <div class="users flex" >
                <ul id="links">
                    <li class="li-login"><a href="login.html">login</a></li>
                    <li class="li-register"><a href="register.html">register</a></li>
                </ul>
                <ul id="user-info">
                    <li><a href="#" id="user"></a></li>
                    <li class="li-cart">
                        <span class="main-span relative">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span id="count-prod" class="size-5 text-center">0</span>
                            <div class="carts-prod absolute">
                                <div class="cart-prods"></div>
                                <a href="cart.html" id="cart">View all products</a>
                            </div>
                        </span>
                    </li>
                    <li><a href="" id="logout">LOG OUT</a></li>
                </ul>
            </div>
        </header>
        <main class="Home">
            <div class="contianer">
                <div class="products relative">
                    <div class="product relative">
                        <div class="product-img-container">
                            <img class="img-normal" src="imges/social-media-dark.png">
                            <img class="img-blured" src="imges/social-media-dark.png">
                        </div>
                        <div class="product-des">
                            <h2>Ammar</h2>
                            <p>software engineer</p>
                        </div>
                        <div class="product-act">
                            <button class="add-cart bg-blue-200">add</button>
                            <i class="fa-regular fa-heart fav"></i>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="js/script.js"></script>        
    </body>
</html>
